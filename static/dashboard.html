<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rápido Express - Administración</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="icon" href="icons/favicon.ico">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <script src="pwa.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js" defer></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="" defer></script>
    <link rel="stylesheet" href="style.css?v=6">
</head>
<body class="role-admin">
<input type="checkbox" id="sidebarToggle" class="sidebar-toggle-checkbox">
<input type="radio" name="vistaAdmin" id="vistaRadioRegistrar" class="vista-radio" checked>
<input type="radio" name="vistaAdmin" id="vistaRadioResumen" class="vista-radio">
<input type="radio" name="vistaAdmin" id="vistaRadioMapa" class="vista-radio">
<input type="radio" name="vistaAdmin" id="vistaRadioDomiciliarios" class="vista-radio">
<input type="radio" name="vistaAdmin" id="vistaRadioDomicilios" class="vista-radio">
<input type="radio" name="vistaAdmin" id="vistaRadioClientes" class="vista-radio">
<input type="radio" name="vistaAdmin" id="vistaRadioGanancias" class="vista-radio">
<div class="app-shell">
    <aside class="sidebar">
        <div class="sidebar-brand"><i class="fa-solid fa-truck-fast"></i><span>Rápido Express</span></div>
        <nav class="sidebar-nav">
            <label for="vistaRadioRegistrar" class="nav-link"><i class="fa-solid fa-box"></i><span>Registrar</span></label>
            <label for="vistaRadioResumen" class="nav-link"><i class="fa-solid fa-chart-simple"></i><span>Resumen</span></label>
            <label for="vistaRadioMapa" class="nav-link"><i class="fa-solid fa-map-location-dot"></i><span>Mapa de Flota</span></label>
            <label for="vistaRadioDomiciliarios" class="nav-link"><i class="fa-solid fa-users"></i><span>Domiciliarios</span></label>
            <label for="vistaRadioDomicilios" class="nav-link"><i class="fa-solid fa-list-check"></i><span>Domicilios</span></label>
            <label for="vistaRadioClientes" class="nav-link"><i class="fa-solid fa-address-book"></i><span>Clientes</span></label>
            <label for="vistaRadioGanancias" class="nav-link"><i class="fa-solid fa-sack-dollar"></i><span>Ganancias</span></label>
        </nav>
        <div class="sidebar-footer">
            <div class="user-chip"><i class="fa-solid fa-user-shield"></i><span id="nombreUsuario">Administrador</span></div>
            <a class="btn-logout" id="btnLogout" href="login.html"><i class="fa-solid fa-right-from-bracket"></i> Cerrar sesión</a>
        </div>
    </aside>

    <div class="main-content">
        <header class="topbar">
            <label for="sidebarToggle" class="btn-menu-toggle"><i class="fa-solid fa-bars"></i></label>
            <h1>Panel de administración</h1>
        </header>

        <main class="grid-container single-panel">
            <section class="glass-panel vista-panel" id="vista-registrar">
                <h2 class="section-title"><i class="fa-solid fa-box"></i> Registrar domicilio</h2>
                <form id="formPedido">
                    <div class="form-group"><label for="idCliente">Cliente</label><select id="idCliente" class="form-control" required></select></div>
                    <div class="form-group"><label for="dirRecogida">Dirección exacta de recogida</label><input id="dirRecogida" class="form-control" required></div>
                    <div class="form-group"><label for="dirEntrega">Dirección exacta de entrega</label><input id="dirEntrega" class="form-control" required></div>
                    <div class="form-group"><label for="valorServicio">Valor total del servicio</label><input type="number" min="0" id="valorServicio" class="form-control" required></div>
                    <div class="form-group"><label for="metodoPago">Método de pago</label><select id="metodoPago" class="form-control"><option>Efectivo</option><option>Transferencia</option></select></div>
                    <div class="form-group"><label for="tiempoEspera">Espera estimada (minutos)</label><input type="number" min="0" id="tiempoEspera" class="form-control"></div>
                    <div class="form-group"><label for="tiempoRecogida">Tiempo para recoger (minutos)</label><input type="number" min="0" id="tiempoRecogida" class="form-control"></div>
                    <div class="form-group"><label for="observaciones">Observaciones</label><textarea id="observaciones" class="form-control"></textarea></div>
                    <button class="btn btn-primary" type="submit">Registrar domicilio</button>
                </form>
            </section>

            <section class="glass-panel vista-panel" id="vista-resumen">
                <h2 class="section-title"><i class="fa-solid fa-chart-simple"></i> Resumen</h2>
                <div id="contenedorEstadisticas" class="stats-grid"></div>
                <div class="chart-container"><canvas id="graficoEstados"></canvas></div>
            </section>

            <section class="glass-panel vista-panel" id="vista-mapa">
                <h2 class="section-title"><i class="fa-solid fa-map-location-dot"></i> Mapa de Flota en Tiempo Real</h2>
                <div id="mapaFlota" style="width: 100%; height: 500px; border-radius: 12px; z-index: 1;"></div>
            </section>

            <section class="glass-panel vista-panel" id="vista-domiciliarios">
                <h2 class="section-title"><i class="fa-solid fa-users"></i> Domiciliarios</h2>
                <form id="formNuevoRepartidor" class="inline-form">
                    <div class="form-group"><label for="repNombre">Nombre completo</label><input id="repNombre" class="form-control" required></div>
                    <div class="form-group"><label for="repCorreo">Correo</label><input type="email" id="repCorreo" class="form-control" required></div>
                    <div class="form-group"><label for="repPassword">Contraseña</label><input type="password" id="repPassword" class="form-control" minlength="6" required></div>
                    <div class="form-group"><label for="repTelefono">Teléfono</label><input id="repTelefono" class="form-control" required></div>
                    <div class="form-group"><label for="repZona">Zona</label><input id="repZona" class="form-control" placeholder="Ej: Zona norte"></div>
                    <button class="btn btn-primary" type="submit"><i class="fa-solid fa-user-plus"></i> Crear domiciliario</button>
                </form>
                <div id="contenedorRepartidores" class="orders-grid"></div>
            </section>

            <section class="glass-panel vista-panel" id="vista-domicilios">
                <h2 class="section-title"><i class="fa-solid fa-list-check"></i> Domicilios registrados</h2>
                <div class="filter-bar">
                    <label for="filtroEstado">Filtrar por estado</label>
                    <select id="filtroEstado" class="form-control">
                        <option value="">Todos</option>
                        <option>Pendiente</option>
                        <option>Asignado</option>
                        <option>En camino</option>
                        <option>Entregado</option>
                        <option>Cancelado</option>
                    </select>
                    <input type="search" id="buscarPedidos" class="form-control" placeholder="Buscar por cliente o número de domicilio...">
                    <button type="button" class="btn-action btn-toggle-off" id="btnExportarCsv"><i class="fa-solid fa-file-csv"></i> Exportar CSV</button>
                </div>
                <div id="contenedorPedidos" class="orders-grid"></div>
                <div class="paginacion" id="paginacionPedidos"></div>
            </section>

            <section class="glass-panel vista-panel" id="vista-clientes">
                <h2 class="section-title"><i class="fa-solid fa-address-book"></i> Clientes registrados</h2>
                <div class="filter-bar">
                    <input type="search" id="buscarClientes" class="form-control" placeholder="Buscar por nombre, teléfono o correo...">
                </div>
                <div id="contenedorClientes" class="orders-grid"></div>
                <div class="paginacion" id="paginacionClientes"></div>
            </section>

            <section class="glass-panel vista-panel" id="vista-ganancias">
                <h2 class="section-title"><i class="fa-solid fa-sack-dollar"></i> Ganancias por domiciliario</h2>
                <div class="filter-bar">
                    <label for="fechaGanancias">Fecha</label>
                    <input type="date" id="fechaGanancias" class="form-control">
                    <span class="paginacion-info" id="porcentajeGanancias"></span>
                </div>
                <div id="contenedorGanancias" class="orders-grid"></div>
                <div id="totalesGanancias" class="stats-grid"></div>
            </section>
        </main>
    </div>
</div>

<div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal-box">
        <div class="modal-header">
            <h3 id="modalTitulo">Editar</h3>
            <button class="modal-close" id="btnCerrarModal" type="button">&times;</button>
        </div>
        <div id="modalCuerpo"></div>
    </div>
</div>
<script src="script.js?v=8" defer></script>
</body>
</html>
