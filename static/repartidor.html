<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rápido Express - Domiciliario</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="icon" href="icons/favicon.ico">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <script src="pwa.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=6">
</head>
<body class="role-repartidor">
<header class="header">
    <div class="brand">
        <i class="fa-solid fa-truck-fast"></i>
        <h1>Rápido Express - Mis domicilios</h1>
    </div>

    <div class="header-actions">

        <div class="notification-container">
            <button id="btnNotificaciones" class="btn-notificacion" type="button">
                <i class="fa-solid fa-bell"></i>
                <span id="contadorNotificaciones" class="notification-badge">0</span>
            </button>

            <div id="panelNotificaciones" class="notification-panel">
                <div class="notification-header">
                    <strong>Notificaciones</strong>
                </div>

                <div id="listaNotificaciones">
                    <p class="notification-empty">
                        No tienes nuevas notificaciones.
                    </p>
                </div>
            </div>
        </div>

        <span class="connection-status">
            <i class="fa-solid fa-circle"></i>
            <span id="nombreUsuario">Domiciliario activo</span>
        </span>

        <a class="btn-logout" id="btnLogout" href="login.html">
            <i class="fa-solid fa-right-from-bracket"></i>
            Cerrar sesión
        </a>

    </div>
</header>
<main class="grid-container single-panel">
    <section class="glass-panel">
        <h2 class="section-title"><i class="fa-solid fa-sack-dollar"></i> Ganancias de hoy</h2>
        <div id="contenedorGananciasPropias" class="stats-grid"></div>
    </section>
    <section class="glass-panel">
        <div class="section-title-row">
            <h2 class="section-title"><i class="fa-solid fa-route"></i> Domicilios asignados</h2>
            <button id="btnActualizarPedidos" class="btn-action btn-camino" type="button"><i class="fa-solid fa-rotate"></i> Actualizar</button>
        </div>
        <p class="help-text">Aquí se muestran únicamente los servicios asignados a su cuenta. Se actualiza solo cada 15 segundos, o al pulsar "Actualizar".</p>
        <div id="contenedorPedidosRepartidor" class="orders-grid"></div>
    </section>
</main>
<script src="script.js?v=8" defer></script>
</body>
</html>
